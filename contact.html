<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>North Star Bakery | Contact</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <img src="bakery-logo.png" alt="North Star Bakery logo, a stylized loaf of bread beneath a star">
    <h1>Contact Us</h1>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="products.html">Products</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section aria-labelledby="location-heading">
      <h2 id="location-heading">Location &amp; Hours</h2>
      <p>Visit us at 118 North Star Avenue. We're open Tuesday through Sunday, 7:00 AM to 3:00 PM, and closed Mondays.</p>
    </section>

    <section aria-labelledby="form-heading">
      <h2 id="form-heading">Inquiry &amp; Pre-Order Request</h2>
      <form action="#" method="post">
        <fieldset>
          <legend>Contact Information</legend>

          <label for="name">Full Name</label>
          <input type="text" id="name" name="name" required minlength="2" placeholder="Jane Doe">

          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" required placeholder="jane@example.com">
        </fieldset>

        <fieldset>
          <legend>Order Details</legend>

          <label for="request-type">Request Type</label>
          <select id="request-type" name="request-type" required>
            <option value="">-- Please choose one --</option>
            <option value="pre-order">Pre-Order</option>
            <option value="general-question">General Question</option>
          </select>

          <label for="pickup-date">Preferred Pickup Date</label>
          <input type="date" id="pickup-date" name="pickup-date" required>

          <label for="item-details">Item Details</label>
          <textarea id="item-details" name="item-details" rows="4" required placeholder="e.g., one signature sourdough loaf, two dozen cinnamon rolls"></textarea>

          <label for="allergy-notes">Allergy Notes (if applicable)</label>
          <textarea id="allergy-notes" name="allergy-notes" rows="2" placeholder="e.g., nut allergy, gluten sensitivity"></textarea>
        </fieldset>

        <button type="submit">Submit Request</button>
      </form>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 North Star Bakery. All rights reserved.</p>
  </footer>
</body>
</html>
